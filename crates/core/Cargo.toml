[package]
name = "fractal-core"
version = "0.1.0"
edition = "2024"

[dependencies]
fractal-protocol.workspace = true
gix = { version = "0.85.0", features = ["merge", "tree-editor"] }
# The three-way merge that carries a human-authored file onto a new tip takes
# gix's own interning type as an argument, and gix does not re-export it.
imara-diff = { package = "gix-imara-diff", version = "0.2" }
jiff = { version = "0.2.32", features = ["serde"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile = "3.27.0"
thiserror.workspace = true
tracing.workspace = true
uzers = "0.12"
