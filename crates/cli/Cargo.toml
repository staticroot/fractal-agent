[package]
name = "fractal-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fractal"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fractal-protocol.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net", "process"] }
