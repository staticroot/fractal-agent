[workspace]
resolver = "3"
members = ["crates/core", "crates/agent", "crates/lawyer", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
fractal-core = { version = "0.1.0", path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.52.3", default-features = false }
zbus = { version = "5.17.0", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ed25519-dalek = "2"
